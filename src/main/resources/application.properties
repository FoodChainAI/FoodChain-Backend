spring.application.name=foodchain

# ---- Server ----
server.port=${SERVER_PORT:8080}

# ---- Datasource (PostgreSQL) ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/foodchain}
spring.datasource.username=${DB_USER:foodchain}
spring.datasource.password=${DB_PASSWORD:foodchain}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
# Schema is owned by Flyway; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

# ---- Flyway ----
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ---- Security / JWT ----
# Base64-encoded 256-bit secret. OVERRIDE in production via env var.
foodchain.jwt.secret=${JWT_SECRET:Y2hhbmdlLW1lLXRoaXMtaXMtYS1kZXYtb25seS1zZWNyZXQtMjU2LWJpdHMtbG9uZy1rZXk=}
foodchain.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
foodchain.jwt.issuer=foodchain-ai

# ---- OpenAPI / Swagger UI ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ---- Payments (mock provider used by default) ----
foodchain.payments.provider=mock

# ---- Geolocation ----
# Road-sinuosity multiplier applied to straight-line distance (roads are longer).
foodchain.geo.sinuosity-factor=${GEO_SINUOSITY_FACTOR:1.3}

# ---- Email (Resend) ----
# Get an API key at https://resend.com. Leave empty to disable (emails are logged, not sent).
foodchain.mail.enabled=${MAIL_ENABLED:true}
foodchain.mail.resend.api-key=${RESEND_API_KEY:}
foodchain.mail.resend.base-url=${RESEND_BASE_URL:https://api.resend.com}
# In test mode without a verified domain, use "onboarding@resend.dev".
foodchain.mail.from=${MAIL_FROM:FoodChain AI <onboarding@resend.dev>}
